# Builds the Microsoft Store MSIX bundle straight from the SDK-style project, with no
# Windows Application Packaging Project (.wapproj) and no MSBuild/Visual Studio:
#
#   dotnet publish win-x64 / win-arm64  ->  winapp package  ->  .msixbundle
#
# All of the logic lives in build/pack-msix.ps1 so the exact same command runs locally.
# The bundle is left unsigned on purpose — Partner Center accepts .msixbundle directly
# and Microsoft re-signs on submission.
#
# This is the only Store packaging pipeline: the legacy msbuild/.wapproj path
# (dotnet-desktop-winstore.yml + Sources/Heads/Pix2d.Desktop.Wap) was deleted once a
# submission built here had gone through Partner Center. Manifest + Store assets now
# live in build/msix/.
#
# The optional `publish` job below uploads that bundle to Partner Center through the
# Microsoft Store Developer CLI. It is manual-only (workflow_dispatch) on purpose —
# a tag push only ever builds the artifact.
name: Windows Store MSIX Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (X.Y.Z). Defaults to Pix2dVersion from Directory.Build.props.'
        required: false
        default: ''
      publish_to_store:
        description: 'Upload the bundle to Partner Center as a draft submission'
        type: boolean
        required: false
        default: false
      submit_for_certification:
        description: 'Also commit the draft (sends it to certification). Needs publish_to_store.'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2025

    env:
      # Pinned deliberately: winapp CLI is still in public preview, so CI must not
      # silently move to a new packer. Bump together with the local install.
      WINAPP_CLI_VERSION: '0.5.0'
      WINAPP_CLI_TELEMETRY_OPTOUT: '1'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Install winapp CLI
      shell: pwsh
      run: npm install -g "@microsoft/winappcli@${env:WINAPP_CLI_VERSION}"

    - name: Determine app version
      id: version
      shell: pwsh
      run: |
        $version = ''
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
        }
        if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.version }}') {
          $version = '${{ github.event.inputs.version }}'
        }
        # Empty is valid: pack-msix.ps1 then falls back to Pix2dVersion.
        Write-Host "Version: '$version'"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Build MSIX bundle
      shell: pwsh
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        # Must be a hashtable, not an array: array splatting binds elements
        # POSITIONALLY, so @('-Version', '1.2.3') lands as -Version '-Version'
        # -Configuration '1.2.3'. Only hashtable splatting passes named parameters.
        # Not named $args — that is a reserved PowerShell automatic variable.
        $packArgs = @{}
        if ('${{ steps.version.outputs.version }}') {
          $packArgs['Version'] = '${{ steps.version.outputs.version }}'
        }
        ./build/pack-msix.ps1 @packArgs

    - name: Upload MSIX bundle
      uses: actions/upload-artifact@v7
      with:
        name: msix-bundle
        path: artifacts/msix/*.msixbundle
        if-no-files-found: error
        retention-days: 14

  # Uploads the bundle built above to Partner Center. Opt-in per run, and even then it
  # stops at a draft submission unless submit_for_certification is also checked.
  #
  # Why the CLI and not the raw API: the retired StoreBroker job (dotnet-desktop-winstore.yml,
  # deleted in f11409d) created a submission, PUT a .msixupload straight at the SAS url and
  # committed — and the published update kept the PREVIOUS release's packages. Two reasons,
  # both easy to reproduce by hand: (1) StoreBroker's Update-ApplicationSubmission leaves the
  # cloned submission's packages untouched unless -AddPackages/-ReplacePackages is passed, so
  # clearing ApplicationPackages in the JSON was a no-op; (2) the SAS url wants a ZIP whose
  # entries match applicationPackages[].fileName with fileStatus=PendingUpload, not a bare
  # package file. msstore does all of that (clone -> declare packages -> zip -> upload ->
  # commit) in one command, and since Dec 2025 it also marks superseded packages PendingDelete.
  #
  # https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/github-actions
  publish:
    needs: build
    if: ${{ inputs.publish_to_store }}
    runs-on: windows-2025
    # The CLI polls Partner Center after a commit; give it room but don't hang a runner all day.
    timeout-minutes: 60

    env:
      # Pix2d in the Store. Same constant as DesktopReviewService / download-store-msix.ps1;
      # not a secret (it's in the public Store url), so it stays readable in the log.
      STORE_PRODUCT_ID: '9NBLGGH1ZDFV'

    steps:
    - name: Download MSIX bundle
      uses: actions/download-artifact@v8
      with:
        name: msix-bundle
        path: artifacts/msix

    - name: Check Partner Center credentials
      shell: pwsh
      env:
        TENANT_ID: ${{ secrets.TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      run: |
        $missing = @('TENANT_ID', 'CLIENT_ID', 'CLIENT_SECRET') |
          Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }
        if ($missing) {
          throw "Missing repository secret(s): $($missing -join ', ')."
        }
        # msstore reconfigure demands a numeric seller id, but the MSIX path never sends it:
        # it only travels as the X-Seller-Account-Id header from MSStore.API/StoreAPI.cs, which
        # is the MSI/EXE API. Packaged (MSIX) submissions go through StorePackagedAPI, which
        # doesn't read it, and reconfigure itself doesn't validate it (its final "Testing
        # configuration" step only acquires a token). Our Partner Center account exposes no
        # Seller ID at all (Account settings > Identifiers shows Windows publisher IDs only,
        # and Legal info has no MPN enrollment), so fall back to a placeholder rather than
        # blocking the whole pipeline on a value nothing in this flow consumes.
        if (-not $env:SELLER_ID) {
          Write-Host "::notice::SELLER_ID secret not set; using placeholder 0 (unused by the MSIX submission path)."
        }

    - name: Resolve bundle path
      id: bundle
      shell: pwsh
      run: |
        $bundle = Get-ChildItem artifacts/msix -Filter *.msixbundle -File | Select-Object -First 1
        if (-not $bundle) { throw "No .msixbundle found in artifacts/msix" }
        Write-Host "Bundle: $($bundle.Name) ($([math]::Round($bundle.Length / 1MB, 1)) MB)"
        "path=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@v1.1

    - name: Configure Microsoft Store Developer CLI
      shell: pwsh
      env:
        TENANT_ID: ${{ secrets.TENANT_ID }}
        SELLER_ID: ${{ secrets.SELLER_ID }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      run: |
        $sellerId = if ($env:SELLER_ID) { $env:SELLER_ID } else { '0' }
        msstore reconfigure `
          --tenantId $env:TENANT_ID `
          --sellerId $sellerId `
          --clientId $env:CLIENT_ID `
          --clientSecret $env:CLIENT_SECRET
        if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

    - name: Create draft submission with the bundle
      shell: pwsh
      run: |
        # -nc keeps it a draft: the package is uploaded and the submission is fully staged,
        # but nothing is sent to certification. That is the dry run — inspect it in Partner
        # Center (Packages must list the new version) before ticking submit_for_certification.
        # -id is required because the CLI can only sniff the app id out of a loose .msix,
        # not a bundle (it looks for a top-level AppxManifest.xml).
        msstore publish "${{ steps.bundle.outputs.path }}" -id $env:STORE_PRODUCT_ID -nc -v
        if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }

    - name: Submit for certification
      if: ${{ inputs.submit_for_certification }}
      shell: pwsh
      run: |
        # Commits the draft staged above (POST .../submissions/{id}/commit).
        msstore submission publish $env:STORE_PRODUCT_ID -v
        if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed ($LASTEXITCODE)" }

    - name: Report submission status
      if: ${{ always() }}
      shell: pwsh
      run: |
        # Informational only — a failure here must not mask the real result above, and the
        # step also runs when an earlier one failed before the CLI was even installed.
        if (Get-Command msstore -ErrorAction SilentlyContinue) {
          msstore submission status $env:STORE_PRODUCT_ID
        }
        exit 0
