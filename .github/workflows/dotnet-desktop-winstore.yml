# LEGACY fallback pipeline: builds the Store MSIX through the .wapproj with MSBuild and
# Visual Studio. Superseded by windows-store-msix.yml (dotnet publish + winapp package),
# which is the one wired to tag pushes. Kept manual-only so a tag does not build the same
# package twice; use it if the winapp-based pipeline has to be rolled back.
name: Windows Store MSIX Package (legacy wapproj)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (format: 3.3.3.0)'
        required: false
        default: ''
      commit_submission:
        description: 'Отправить на сертификацию сразу? (true/false)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: windows-2025-vs2026

    env:
      DESKTOP_PROJECT_PATH: Sources/Heads/Pix2d.Desktop/Pix2d.Desktop.csproj
      WAP_PROJECT_DIR: Sources/Heads/Pix2d.Desktop.Wap
      WAP_PROJECT_PATH: Sources/Heads/Pix2d.Desktop.Wap/Pix2d.Desktop.Wap.wapproj
      CONFIGURATION: Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        vs-prerelease: true
        vs-version: '[18.0,19.0)'
        msbuild-architecture: x64

    - name: Determine App Version
      id: get_version
      shell: pwsh
      run: |
        $rawVersion = ""

        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $rawVersion = $env:GITHUB_REF -replace 'refs/tags/v', ''
        }
        if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}") {
          $rawVersion = "${{ github.event.inputs.version }}"
        }
        if (-not $rawVersion) { $rawVersion = "1.0.0.0" }

        $parts = $rawVersion.Split('.')
        $v = @(0, 0, 0, 0)
        for ($i = 0; $i -lt [Math]::Min($parts.Count, 4); $i++) {
            $val = 0
            if ([int]::TryParse($parts[$i], [ref]$val)) { $v[$i] = $val }
        }
        $finalVersion = $v -join '.'

        Write-Host "Final Version for MSIX: $finalVersion"
        echo "APP_VERSION=$finalVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Patch AppxManifest version
      shell: pwsh
      run: |
        $manifestPath = "$env:WAP_PROJECT_DIR/Package.appxmanifest"
        $newVersion = "${{ env.APP_VERSION }}"
        Write-Host "Patching manifest at $manifestPath with version $newVersion"

        try {
            [xml]$manifest = New-Object System.Xml.XmlDocument
            $manifest.Load($manifestPath)
            $identityNode = $manifest.SelectSingleNode("//*[local-name()='Package']/*[local-name()='Identity']")
            if ($identityNode -ne $null -and $identityNode.Attributes['Version'] -ne $null) {
                $identityNode.Attributes['Version'].Value = $newVersion
            } else {
                throw "Could not find 'Identity' element or 'Version' attribute."
            }

            $xmlWriter = New-Object System.Xml.XmlTextWriter($manifestPath, (New-Object System.Text.UTF8Encoding($false)))
            $xmlWriter.Formatting = [System.Xml.Formatting]::Indented
            $manifest.Save($xmlWriter)
            $xmlWriter.Close()
            Write-Host "Manifest patched successfully."
        } catch {
            Write-Error "Failed to patch Package.appxmanifest: $_"
            exit 1
        }

    - name: Restore NuGet packages
      run: |
        dotnet restore $env:DESKTOP_PROJECT_PATH -r win-x64 --property WarningLevel=0
        dotnet restore $env:DESKTOP_PROJECT_PATH -r win-arm64 --property WarningLevel=0
        msbuild $env:WAP_PROJECT_PATH /t:Restore /p:Configuration=$env:CONFIGURATION /p:IsWAPHeadProject=true /p:AppxBundlePlatforms="x64|arm64" /p:Platform=x64

    - name: Decode signing certificate
      shell: pwsh
      run: |
        $certBytes = [Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
        $certPath = Join-Path -Path $env:WAP_PROJECT_DIR -ChildPath 'certificate.pfx'
        [IO.File]::WriteAllBytes($certPath, $certBytes)

    - name: Build MSIX package
      shell: pwsh
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        msbuild $env:WAP_PROJECT_PATH `
          /p:IsWAPHeadProject=true `
          /p:Configuration=$env:CONFIGURATION `
          /p:AppxBundle=Always `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundlePlatforms="x64|arm64" `
          /p:PackageCertificateKeyFile="$env:WAP_PROJECT_DIR/certificate.pfx" `
          /p:SentryDsn=$env:SENTRY_DSN `
          /p:Platform=x64

    - name: Remove signing certificate
      shell: pwsh
      run: Remove-Item -Path "$env:WAP_PROJECT_DIR/certificate.pfx" -Force

    - name: Zip AppPackages output
      shell: pwsh
      run: |
        $source = "${{ env.WAP_PROJECT_DIR }}/AppPackages"
        $destination = "${{ env.WAP_PROJECT_DIR }}/msix-package.zip"
        if (Test-Path $destination) { Remove-Item $destination -Force }
        Compress-Archive -Path "$source\*" -DestinationPath $destination

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: msix-package
        path: ${{ env.WAP_PROJECT_DIR }}/msix-package.zip
        retention-days: 7

  upload-to-store:
    if: ${{ false }}
    needs: build
    runs-on: windows-latest
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: msix-package
        path: ./artifacts

    - name: Unzip downloaded package
      shell: pwsh
      run: Expand-Archive -Path ./artifacts/msix-package.zip -DestinationPath ./artifacts -Force

    - name: Upload to Microsoft Store
      shell: pwsh
      env:
        TENANT_ID: ${{ secrets.TENANT_ID }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
        COMMIT_OVERRIDE: ${{ github.event.inputs.commit_submission }}
      run: |
        $VerbosePreference = "Continue"

        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        if (-not (Get-Module -ListAvailable -Name StoreBroker)) {
            Write-Host "Installing StoreBroker module..."
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
            Install-Module -Name StoreBroker -Force -AllowClobber -Scope CurrentUser
        }
        
        Import-Module StoreBroker -Force

        $packageFile = Get-ChildItem -Path ./artifacts -Filter *.msixupload -Recurse | Select-Object -First 1
        if (-not $packageFile) { throw ".msixupload file not found" }

        try {
            $secureSecret = ConvertTo-SecureString $env:CLIENT_SECRET -AsPlainText -Force
            $credential = New-Object System.Management.Automation.PSCredential($env:CLIENT_ID, $secureSecret)

            Write-Host "Authenticating..."
            Set-StoreBrokerAuthentication -TenantId $env:TENANT_ID -Credential $credential

            Write-Host "Creating new submission (cloning last published)..."
            $submission = New-ApplicationSubmission -AppId $env:PRODUCT_ID -Verbose

            Write-Host "Uploading package to Store storage..."
            Set-SubmissionPackage -PackagePath $packageFile.FullName -UploadUrl $submission.fileUploadUrl -Verbose

            # --- ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ СПИСКА ПАКЕТОВ ---
            # Чтобы убрать старые пакеты (x86) и подтянуть новые, нужно обновить сабмит,
            # передав пустой массив ApplicationPackages. Store API просканирует загруженный blob.
            $submission.ApplicationPackages = @()
            $submissionJsonPath = Join-Path $env:RUNNER_TEMP "submission.json"
            $submission | ConvertTo-Json -Depth 10 -Compress | Out-File -FilePath $submissionJsonPath -Encoding utf8
            
            Write-Host "Updating submission metadata to trigger package ingestion..."
            Update-ApplicationSubmission -AppId $env:PRODUCT_ID -SubmissionId $submission.Id -SubmissionDataPath $submissionJsonPath -Verbose
            # -----------------------------------------------

            $isWorkflowDispatch = $env:GITHUB_EVENT_NAME -eq "workflow_dispatch"
            $commitOverride = $env:COMMIT_OVERRIDE
            
            # Логика: коммитим, если это пуш тега ИЛИ если ручной запуск с флагом 'true'
            $shouldCommit = ($env:GITHUB_EVENT_NAME -eq "push") -or ($isWorkflowDispatch -and $commitOverride -eq "true")

            if (-not $shouldCommit) {
                Write-Host "Submission created and package uploaded. Skipping Complete (Manual review required in Partner Center)."
            } else {
                Write-Host "Completing submission to trigger ingestion and certification..."
                Complete-ApplicationSubmission -AppId $env:PRODUCT_ID -SubmissionId $submission.Id -Verbose
                Write-Host "Success! Check Partner Center for certification progress."
            }
        }
        catch {
            Write-Error "Failed to upload to Store: $_"
            exit 1
        }