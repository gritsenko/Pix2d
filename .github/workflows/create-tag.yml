name: Create Tag on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/Directory.Build.props'

jobs:
  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
      
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }} # Use the PAT to trigger subsequent workflows

      - name: Extract version from Directory.Build.props
        id: get_version
        run: |
          VERSION=$(grep '<Pix2dVersion>' Sources/Directory.Build.props | sed -n 's/.*<Pix2dVersion>\(.*\)<\/Pix2dVersion>.*/\1/p' | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push Git tag
        env:
          TAG_NAME: v${{ steps.get_version.outputs.version }}
        run: |
          echo "Attempting to create tag: ${TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if tag already exists
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists. Skipping."
          else
            echo "Creating and pushing new tag ${TAG_NAME}"
            git tag "${TAG_NAME}" -m "Release version ${{ steps.get_version.outputs.version }}"
            git push origin "${TAG_NAME}"
          fi